<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <style>
    .tile { fill: #104f29; }
    .mark { fill: #ffffff; }
    /* Dark browser tabs: lighter brand green tile, near-black mark */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #459b61; }
      .mark { fill: #090c09; }
    }
  </style>
  <rect class="tile" width="48" height="48" rx="11"/>
  <text class="mark" x="24" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="-0.5">ES</text>
</svg>
